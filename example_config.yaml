    timeout:
      name: "Timeout"
    light_threshold:
      name: "Light Threshold"
    max_move_distance_gate:
      name: "Max Move Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"
    g0:
      move_threshold:
        name: "0.0m move threshold"
        id: gate_0_movement_threshold
      still_threshold:
        name: "0.0m still threshold"
        id: gate_0_still_threshold
    g1:
      move_threshold:
        name: "0.75m move threshold"
        id: gate_1_movement_threshold
      still_threshold:
        name: "0.75m still threshold"
        id: gate_1_still_threshold
    g2:
      move_threshold:
        name: "1.5m move threshold"
        id: gate_2_movement_threshold
      still_threshold:
        name: "1.5m still threshold"
        id: gate_2_still_threshold
    g3:
      move_threshold:
        name: "2.25m move threshold"
        id: gate_3_movement_threshold
      still_threshold:
        name: "2.25m still threshold"
        id: gate_3_still_threshold
    g4:
      move_threshold:
        name: "3.0m move threshold"
        id: gate_4_movement_threshold
      still_threshold:
        name: "3.0m still threshold"
        id: gate_4_still_threshold
    g5:
      move_threshold:
        name: "3.75m move threshold"
        id: gate_5_movement_threshold
      still_threshold:
        name: "3.75m still threshold"
        id: gate_5_still_threshold
    g6:
      move_threshold:
        name: "4.5m move threshold"
        id: gate_6_movement_threshold
      still_threshold:
        name: "4.5m still threshold"
        id: gate_6_still_threshold
    g7:
      move_threshold:
        name: "5.2m move threshold"
        id: gate_7_movement_threshold
      still_threshold:
        name: "5.2m still threshold"
        id: gate_7_still_threshold
    g8:
      move_threshold:
        name: "6.0m move threshold"
        id: gate_8_movement_threshold
      still_threshold:
        name: "6.0m still threshold"
        id: gate_8_still_threshold

button:
  - platform: ld2410
    factory_reset:
      name: "Factory Reset"
    restart:
      name: "Restart"
    query_params:
      name: "Query Params"

# Example automations using actions
on_boot:
  - delay: 5s
  - ld2410_calibrator.start_noise_floor_calibration:
      id: calibrator

# Additional automation examples:
# 
# # Start movement calibration when a button is pressed
# on_...:
#   - ld2410_calibrator.start_movement_calibration:
#       id: calibrator
#
# # Start blocking movement capture
# on_...:
#   - ld2410_calibrator.start_blocking_movement_capture:
#       id: calibrator
#
# # Stop blocking movement capture
# on_...:
#   - ld2410_calibrator.stop_blocking_movement_capture:
#       id: calibrator
#
# # Apply calibration after collecting data
# on_...:
#   - ld2410_calibrator.apply_calibration:
#       id: calibrator
#
# # Reset all calibration data
# on_...:
#   - ld2410_calibrator.reset_all:
#       id: calibrator

# Configuration Notes:
# 
# 1. All platform components (buttons, numbers, sensors, text_sensors) are now 
#    configured directly under the main ld2410_calibrator component
#
# 2. Number controls support initial_value, min_value, max_value, step, and restore_value
#    Example:
#    sensitivity:
#      name: "Calibration Sensitivity"
#      initial_value: 0.8
#      min_value: 0.0
#      max_value: 1.0
#      step: 0.01
#      restore_value: true
#
# 3. All buttons automatically get appropriate icons and entity categories
#
# 4. Progress sensor shows percentage completion during calibration
#
# 5. Status text sensor shows current calibration state and progress
#
# 6. Gate sensor configuration remains the same - link LD2410 sensors to 
#    calibrator component for energy monitoring and threshold control
#
# 7. Distance settings (max_movement_detection_distance, max_still_detection_distance):
#    - Range: 0.0 to 6.0 meters
#    - Each gate represents 75cm (0.75m) of distance
#    - Gate 0: 0-0.75m, Gate 1: 0.75-1.5m, Gate 2: 1.5-2.25m, etc.
#    - The final max distance gate is the minimum of:
#      a) The gate calculated from calibration data
#      b) The gate calculated from the distance setting
#    - This allows you to limit detection range even if calibration suggests longer ranges
#    - Can be configured as component-level settings or as number controls for dynamic adjustment
#
# 8. Number controls for distance settings:
#    - max_movement_detection_distance and max_still_detection_distance can be exposed as number entities
#    - Users can adjust these values in real-time through Home Assistant UI
#    - Changes are applied immediately and trigger recalibration
#    - Default step size is 0.25m (matches gate boundaries at 0.75m intervals)
#    - Example:
#      max_movement_detection_distance:
#        name: "Max Movement Range"
#        initial_value: 4.5
#        min_value: 0.0
#        max_value: 6.0
#        step: 0.25