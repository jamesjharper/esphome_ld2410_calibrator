        name: "0.0m move energy"
      still_energy:
        id: gate_0_still_energy
        name: "0.0m still energy"
    g1:
      move_energy:
        id: gate_1_move_energy
        name: "0.75m move energy"
      still_energy:
        id: gate_1_still_energy
        name: "0.75m still energy"
    g2:
      move_energy:
        id: gate_2_move_energy
        name: "1.5m move energy"
      still_energy:
        id: gate_2_still_energy
        name: "1.5m still energy"
    g3:
      move_energy:
        id: gate_3_move_energy
        name: "2.25m move energy"
      still_energy:
        id: gate_3_still_energy
        name: "2.25m still energy"
    g4:
      move_energy:
        id: gate_4_move_energy
        name: "3.0m move energy"
      still_energy:
        id: gate_4_still_energy
        name: "3.0m still energy"
    g5:
      move_energy:
        id: gate_5_move_energy
        name: "3.75m move energy"
      still_energy:
        id: gate_5_still_energy
        name: "3.75m still energy"
    g6:
      move_energy:
        id: gate_6_move_energy
        name: "4.5m move energy"
      still_energy:
        id: gate_6_still_energy
        name: "4.5m still energy"
    g7:
      move_energy:
        id: gate_7_move_energy
