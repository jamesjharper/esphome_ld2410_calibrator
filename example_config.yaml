esphome:
  name: ld2410-calibrator-example
  platform: ESP32
  board: esp32dev

wifi:
  ssid: "YourSSID"
  password: "YourPassword"

logger:

api:

ota:

uart:
  rx_pin: GPIO27  
  tx_pin: GPIO13
  baud_rate: 256000

ld2410: {}

# LD2410 Calibrator Component Configuration
# 
# MINIMAL CONFIGURATION:
# ld2410_calibrator:
#   id: calibrator
#   # Basic buttons for calibration
#   noise_floor_start:
#     name: "Start Noise Floor"
#   apply_calibration:
#     name: "Apply Calibration"
#   calibration_status:
#     name: "Status"
#
# MINIMAL CONFIGURATION WITH DISTANCE CONTROLS:
# ld2410_calibrator:
#   id: calibrator
#   max_movement_detection_distance:
#     name: "Max Movement Range"
#     initial_value: 4.5
#   max_still_detection_distance:
#     name: "Max Still Range"
#     initial_value: 3.0
#   calibration_status:
#     name: "Status"
#
# FULL CONFIGURATION (with all options):
ld2410_calibrator:
  id: calibrator
  # Component-level sensitivity settings (required)
  still_sensitivity: 0.8  # Sensitivity for still detection
  movement_sensitivity: 0.7  # Sensitivity for movement detection
  still_blocking_sensitivity: 1.0  # Sensitivity for still blocking threshold calculation
  movement_blocking_sensitivity: 1.0  # Sensitivity for movement blocking threshold calculation
  # Maximum detection distance settings (0-6m range)
  max_movement_detection_distance: 4.5  # Maximum distance for movement detection (meters)
  max_still_detection_distance: 3.0     # Maximum distance for still detection (meters)
  gate_sensors:
    - gate: 0
      still_sensor: gate_0_still_energy
      move_sensor: gate_0_move_energy
      still_threshold: gate_0_still_threshold
      move_threshold: gate_0_movement_threshold
    - gate: 1
      still_sensor: gate_1_still_energy
      move_sensor: gate_1_move_energy
      still_threshold: gate_1_still_threshold
      move_threshold: gate_1_movement_threshold
    - gate: 2
      still_sensor: gate_2_still_energy
      move_sensor: gate_2_move_energy
      still_threshold: gate_2_still_threshold
      move_threshold: gate_2_movement_threshold
    - gate: 3
      still_sensor: gate_3_still_energy
      move_sensor: gate_3_move_energy
      still_threshold: gate_3_still_threshold
      move_threshold: gate_3_movement_threshold
    - gate: 4
      still_sensor: gate_4_still_energy
      move_sensor: gate_4_move_energy
      still_threshold: gate_4_still_threshold
      move_threshold: gate_4_movement_threshold
    - gate: 5
      still_sensor: gate_5_still_energy
      move_sensor: gate_5_move_energy
      still_threshold: gate_5_still_threshold
      move_threshold: gate_5_movement_threshold
    - gate: 6
      still_sensor: gate_6_still_energy
      move_sensor: gate_6_move_energy
      still_threshold: gate_6_still_threshold
      move_threshold: gate_6_movement_threshold
    - gate: 7
      still_sensor: gate_7_still_energy
      move_sensor: gate_7_move_energy
      still_threshold: gate_7_still_threshold
      move_threshold: gate_7_movement_threshold
    - gate: 8
      still_sensor: gate_8_still_energy
      move_sensor: gate_8_move_energy
      still_threshold: gate_8_still_threshold
      move_threshold: gate_8_movement_threshold

  # Number controls (modern configuration)
  still_sensitivity:
    name: "Still Sensitivity"
    initial_value: 0.8
  movement_sensitivity:
    name: "Movement Sensitivity"
    initial_value: 0.7
  still_blocking_sensitivity:
    name: "Still Blocking Sensitivity"
    initial_value: 1.0
  movement_blocking_sensitivity:
    name: "Movement Blocking Sensitivity"
    initial_value: 1.0
  max_movement_detection_distance:
    name: "Max Movement Detection Distance"
    initial_value: 4.5
    step: 0.25
  max_still_detection_distance:
    name: "Max Still Detection Distance"
    initial_value: 3.0
    step: 0.25
  noise_floor_duration:
    name: "Noise Floor Duration"
    initial_value: 30

  # Progress sensor
  calibration_progress:
    name: "Calibration Progress"

  # Status text sensor  
  calibration_status:
    name: "Calibration Status"

  # Calibration control buttons
  noise_floor_start:
    name: "Start Noise Floor Calibration"
  noise_floor_stop:
    name: "Stop Noise Floor Calibration"
  movement_start:
    name: "Start Movement Calibration"
  movement_stop:
    name: "Stop Movement Calibration"
  still_position_start:
    name: "Start Still Position Capture"
  still_position_stop:
    name: "Stop Still Position Capture"
  blocking_position_start:
    name: "Start Blocking Position Capture"
  blocking_position_stop:
    name: "Stop Blocking Position Capture"
  blocking_movement_start:
    name: "Start Blocking Movement Capture"
  blocking_movement_stop:
    name: "Stop Blocking Movement Capture"
  apply_calibration:
    name: "Apply Calibration"

  # Reset buttons
  reset_noise_floor:
    name: "Reset Noise Floor Data"
  reset_still_signal:
    name: "Reset Still Signal Data"
  reset_movement_signal:
    name: "Reset Movement Signal Data"
  reset_blocking_signal:
    name: "Reset Blocking Signal Data"
  reset_all:
    name: "Reset All Calibration Data"

binary_sensor:
